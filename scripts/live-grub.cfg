set default="0"
set timeout=10

menuentry "Start xfce-aerolike Live" {
  linux /boot/vmlinuz root=live:LABEL=xfce-aerolike ro rd.live.image quiet
  initrd /boot/initramfs.img
}

menuentry "Start xfce-aerolike Live (nomodeset)" {
  linux /boot/vmlinuz root=live:LABEL=xfce-aerolike ro rd.live.image nomodeset quiet
  initrd /boot/initramfs.img
}
