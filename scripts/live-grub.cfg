set default="0"
set timeout=10

menuentry "Start xfce-aerolike Live" {
  linux /boot/vmlinuz root=live:CDLABEL=xfce-aerolike ro rd.live.image rd.live.dir=/LiveOS quiet
  initrd /boot/initramfs.img
}

menuentry "Start xfce-aerolike Live (nomodeset)" {
  linux /boot/vmlinuz root=live:CDLABEL=xfce-aerolike ro rd.live.image rd.live.dir=/LiveOS nomodeset quiet
  initrd /boot/initramfs.img
}
