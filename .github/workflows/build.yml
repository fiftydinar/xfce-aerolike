name: bluebuild
on:
  push:
    paths-ignore:
      - "**.md"
      - ".github/workflows/build-packages.yml"
      - ".github/workflows/build-qcow2-only.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.yml
    steps:
      - name: Build Custom Image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: false

  generate-disk-image:
    name: Generate disk image (qcow2)
    runs-on: ubuntu-latest
    needs: bluebuild
    permissions:
      contents: read
      packages: read
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Build disk-ready container
        run: |
          sudo podman build \
            -t xfce-aerolike-disk \
            -f Containerfile.disk \
            .

      - name: Convert to qcow2 via bootc-image-builder
        run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 \
            --rootfs ext4 \
            localhost/xfce-aerolike-disk

      - name: Compress disk image
        run: |
          zstd -T0 -19 output/qcow2/disk.qcow2 -o xfce-aerolike.qcow2.zst

      - uses: actions/upload-artifact@v4
        with:
          name: xfce-aerolike-disk
          path: xfce-aerolike.qcow2.zst
          compression-level: 0