name: Build packages
on:
  schedule:
    - cron: "00 04 * * *"
  workflow_dispatch:
    inputs:
      kernel-cmdline:
        description: 'Kernel cmdline args, use commas between each arg'
        required: false
        default: ''

env:
  KERNEL_CMDLINE: "nmi_watchdog=0,modprobe.blacklist=i5500_temp,coretemp,intel_idle,intel_cstate,intel_uncore,acpi_cpufreq,pcc_cpufreq,intel_powerclamp,i7core_edac,intel_rapl_msr,intel_rapl_common,intel_pmc_bxt,k10temp,rapl,sp5100_tco,wmi,eeepc_wmi,asus_wmi,amd_pstate=disable,idle=halt,intel_pstate=disable,intel_idle.max_cstate=0,tsc=unstable,nowatchdog"

jobs:
  build-base:
    name: ${{ matrix.pkg.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - name: linux-lts
            repo: https://gitlab.archlinux.org/archlinux/packaging/packages/linux-lts.git

          - name: xfdesktop
            repo: https://gitlab.archlinux.org/archlinux/packaging/packages/xfdesktop.git
            prepare: |
              sed -i 's|--prefix=/usr|--prefix=/usr --with-default-backdrop-filename=/usr/share/backgrounds/frosted-glass.webp|g' ./PKGBUILD

          - name: xfce4-screensaver
            repo: https://gitlab.archlinux.org/archlinux/packaging/packages/xfce4-screensaver.git

          - name: corefreq
            repo: https://aur.archlinux.org/corefreq.git
            prepare: |
              sed -i 's|make |make DELAY_TSC=1 |g' ./PKGBUILD

          - name: gtk2
            repo: https://aur.archlinux.org/gtk2.git

          - name: gtk-nocsd-git
            repo: https://aur.archlinux.org/gtk-nocsd-git.git
            prepare: |
              sed -i 's|LIBDIR="/usr/lib"|LIBDIR="/usr/lib" NOOPT=1|' ./PKGBUILD

          - name: networkmanager-dispatcher-chrony
            repo: https://aur.archlinux.org/networkmanager-dispatcher-chrony.git

          - name: dwarfs-bin
            repo: https://aur.archlinux.org/dwarfs-bin.git

    container:
      image: docker.io/archlinux:latest
      options: --cap-add=SYS_ADMIN

    steps:
      - name: Setup build environment
        run: |
          pacman -Sy --noconfirm base-devel git sudo pacman-contrib
          useradd -m builder && echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers

      - name: Clone package repo
        run: |
          rm -rf /build
          git clone --depth 1 "${{ matrix.pkg.repo }}" /build
          ls -la /build/

      - name: Override kernel cmdline
        if: ${{ matrix.pkg.name == 'linux-lts' && github.event.inputs.kernel-cmdline != '' }}
        run: |
          echo "KERNEL_CMDLINE=${{ github.event.inputs.kernel-cmdline }}" >> $GITHUB_ENV

      - name: Apply patches
        if: ${{ matrix.pkg.prepare && matrix.pkg.name != 'linux-lts' }}
        run: |
          cd /build && ${{ matrix.pkg.prepare }}

      - name: Install dependencies
        run: |
          cd /build
          . ./PKGBUILD
          pacman -Sy --noconfirm --needed base-devel ${depends[@]} ${makedepends[@]} 2>/dev/null || true

      - name: Build package
        run: |
          cd /build
          echo "::group::Building ${{ matrix.pkg.name }}"
          chown -R builder:builder /build
          if [ "${{ matrix.pkg.name }}" = "linux-lts" ]; then
            echo "Patching kernel cmdline..."
            sudo -u builder makepkg --noconfirm --syncdeps --nocheck --skippgpcheck --nobuild
            SRCDIR=$(find /build/src -maxdepth 1 -type d -name 'linux-*' | head -1)
            [ -n "$SRCDIR" ] || { echo "ERROR: source dir not found"; exit 1; }
            cd "$SRCDIR"
            sed -i "s|# CONFIG_CMDLINE_BOOL is not set|CONFIG_CMDLINE_BOOL=y|" .config
            echo "CONFIG_CMDLINE=\"$KERNEL_CMDLINE\"" >> .config
            cd /build
            chown -R builder:builder /build
            sudo -u builder makepkg --noconfirm --syncdeps --nocheck --skippgpcheck --noextract
          elif [ "${{ matrix.pkg.name }}" = "xfce4-screensaver" ]; then
            echo "Applying wallpaper patch..."
            sudo -u builder makepkg --noconfirm --syncdeps --nocheck --nobuild
            SRCDIR=$(find /build/src -maxdepth 1 -type d -name 'xfce4-screensaver*' | head -1)
            [ -n "$SRCDIR" ] || { echo "ERROR: source dir not found"; exit 1; }
            curl -sLO https://raw.githubusercontent.com/fiftydinar/xfce-aerolike/refs/heads/main/patches/xfce4-screensaver/0001-set-default-wallpaper.patch
            cd "$SRCDIR"
            patch -p1 < /build/0001-set-default-wallpaper.patch
            cd /build
            echo "Building patched package..."
            sudo -u builder makepkg --noconfirm --syncdeps --nocheck --noextract
          else
            sudo -u builder makepkg --noconfirm --syncdeps --nocheck
          fi
          echo "::endgroup::"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg.name }}
          path: /build/*.pkg.tar.zst
          compression-level: 0

  build-libwnck:
    name: libwnck
    runs-on: ubuntu-latest
    needs: build-base
    container:
      image: docker.io/archlinux:latest
      options: --cap-add=SYS_ADMIN

    steps:
      - name: Setup build environment
        run: |
          pacman -Sy --noconfirm base-devel git sudo pacman-contrib
          useradd -m builder && echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers

      - name: Download gtk2
        uses: actions/download-artifact@v4
        with:
          name: gtk2
          path: /deps

      - name: Install gtk2
        run: pacman -U --noconfirm /deps/*.pkg.tar.zst

      - name: Clone repo
        run: |
          rm -rf /build
          git clone --depth 1 https://aur.archlinux.org/libwnck.git /build
          ls -la /build/

      - name: Install dependencies
        run: |
          cd /build
          . ./PKGBUILD
          pacman -Sy --noconfirm --needed base-devel ${depends[@]} ${makedepends[@]} 2>/dev/null || true

      - name: Build package
        run: |
          cd /build
          chown -R builder:builder /build
          sudo -u builder makepkg --noconfirm --syncdeps --nocheck

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: libwnck
          path: /build/*.pkg.tar.zst
          compression-level: 0

  build-dependent:
    name: ${{ matrix.pkg.name }}
    runs-on: ubuntu-latest
    needs: [build-base, build-libwnck]
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - name: compiz
            repo: https://aur.archlinux.org/compiz.git
            deps: gtk2 libwnck

          - name: emerald
            repo: https://aur.archlinux.org/emerald.git
            deps: gtk2 libwnck

    container:
      image: docker.io/archlinux:latest
      options: --cap-add=SYS_ADMIN

    steps:
      - name: Setup build environment
        run: |
          pacman -Sy --noconfirm base-devel git sudo pacman-contrib
          useradd -m builder && echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers

      - name: Download AUR dependencies
        uses: actions/download-artifact@v4
        with:
          name: gtk2
          path: /deps

      - uses: actions/download-artifact@v4
        with:
          name: libwnck
          path: /deps

      - name: Install AUR dependencies
        run: |
          pacman -U --noconfirm /deps/*.pkg.tar.zst

      - name: Clone repo
        run: |
          rm -rf /build
          git clone --depth 1 "${{ matrix.pkg.repo }}" /build
          ls -la /build/

      - name: Install dependencies
        run: |
          cd /build
          . ./PKGBUILD
          pacman -Sy --noconfirm --needed base-devel ${depends[@]} ${makedepends[@]} 2>/dev/null || true

      - name: Build package
        run: |
          cd /build
          echo "::group::Building ${{ matrix.pkg.name }}"
          chown -R builder:builder /build
          sudo -u builder makepkg --noconfirm --syncdeps --nocheck
          echo "::endgroup::"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg.name }}
          path: /build/*.pkg.tar.zst
          compression-level: 0

  publish:
    name: Publish release
    needs: [build-base, build-libwnck, build-dependent]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create release archive
        run: |
          mkdir packages
          echo "## Built packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| # | Package | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          i=1
          for pkgname in linux-lts xfdesktop xfce4-screensaver corefreq gtk2 libwnck gtk-nocsd-git networkmanager-dispatcher-chrony dwarfs-bin compiz emerald; do
            pkgfile=$(ls "$pkgname/"*.pkg.tar.zst 2>/dev/null | head -1)
            if [ -n "$pkgfile" ]; then
              size=$(du -h "$pkgfile" | cut -f1)
              cp "$pkgfile" packages/
              echo "| $i | $pkgname | $size |" >> $GITHUB_STEP_SUMMARY
              i=$((i + 1))
            fi
          done
          tar -czf xfce-aerolike-packages.tar.gz packages/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: packages-${{ github.run_id }}
          files: |
            xfce-aerolike-packages.tar.gz
            packages/*.pkg.tar.zst