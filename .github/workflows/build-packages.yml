name: Build packages
on:
  schedule:
    - cron: "00 03 * * *"
  workflow_dispatch:

jobs:
  build-foundation:
    name: ${{ matrix.pkg.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - name: linux
            enabled: true
            repo: https://gitlab.archlinux.org/archlinux/packaging/packages/linux.git
            skippgpcheck: true
            prepare: |
              set -x
              # NOTE: the first line must be a command, not a comment --
              # this step runs as `cd /build && $prepare`, so a leading
              # '#' would leave `&&` with nothing to execute.
              sed -i '/^  "$pkgbase-headers"$/d' ./PKGBUILD
              sed -i '/^  "$pkgbase-docs"$/d' ./PKGBUILD
              # Drop the linux-headers and linux-docs subpackages (headers
              # and documentation only, not needed at runtime). The eval
              # loop generates one package function per pkgname entry, so
              # removing them is sufficient.
              # Assertion: fail loudly if the edit didn't take effect
              # (upstream PKGBUILD structure changed). Note: this must be
              # an `if` block, NOT `grep -q ... && exit 1` -- the latter
              # returns 1 when grep finds nothing (the success case) and
              # trips `set -e`.
              #
              # Match the exact pkgname-array form `  "$pkgbase-headers"`
              # (quoted name, end of line). The `pkgbase-headers` substring
              # ALSO appears in upstream's optdepends ("$pkgbase-headers:
              # headers and scripts for building modules"), which must be
              # kept and must NOT trip this assertion.
              bash -n ./PKGBUILD || { echo "ERROR: linux PKGBUILD syntax broken after edits"; exit 1; }
              if grep -q '^  "$pkgbase-headers"$' ./PKGBUILD; then
                echo "ERROR: linux-headers still in pkgname after edits"
                exit 1
              fi
              if grep -q '^  "$pkgbase-docs"$' ./PKGBUILD; then
                echo "ERROR: linux-docs still in pkgname after edits"
                exit 1
              fi
            patch: |
              SRCDIR=$(find "${BUILDDIR:-/build}/src" -maxdepth 1 -type d -name 'linux-*' | head -1)
              [ -n "$SRCDIR" ] || { echo "ERROR: source dir not found"; exit 1; }

              # Install git for cloning bcachefs-tools
              pacman -S --noconfirm --needed git

              # Clone bcachefs-tools for the kernel module source (latest release tag)
              BCACHEFS_TAG=$(git ls-remote --tags --refs https://evilpiepirate.org/git/bcachefs-tools.git | grep -o 'v[0-9.]*$' | sort -V | tail -1)
              git clone --depth 1 --branch "$BCACHEFS_TAG" https://evilpiepirate.org/git/bcachefs-tools.git /tmp/bcachefs-tools

              # Copy kernel module source into kernel tree
              rm -rf "$SRCDIR/fs/bcachefs"
              mkdir -p "$SRCDIR/fs/bcachefs"
              cp -r /tmp/bcachefs-tools/fs/* "$SRCDIR/fs/bcachefs/"

              # Patch fs/Kconfig to add bcachefs entry
              sed -i '/source "fs\/zonefs\/Kconfig"/a source "fs/bcachefs\/Kconfig"' "$SRCDIR/fs/Kconfig"

              # Patch fs/Makefile to build bcachefs
              echo 'obj-$(CONFIG_BCACHEFS_FS)  += bcachefs/' >> "$SRCDIR/fs/Makefile"

              # Enable bcachefs kernel options, disable debug info to save space
              cd "$SRCDIR"
              scripts/config --enable CONFIG_BCACHEFS_FS
              scripts/config --enable CONFIG_UNICODE
              scripts/config --disable CONFIG_DEBUG_INFO
              cd /build

          - name: xfce4-screensaver
            enabled: true
            repo: https://gitlab.archlinux.org/archlinux/packaging/packages/xfce4-screensaver.git
            patch: |
              SRCDIR=$(find "${BUILDDIR:-/build}/src" -maxdepth 1 -type d -name 'xfce4-screensaver*' | head -1)
              [ -n "$SRCDIR" ] || { echo "ERROR: source dir not found at ${BUILDDIR:-/build}/src"; exit 1; }
              curl -sLO https://raw.githubusercontent.com/fiftydinar/xfce-aerolike/refs/heads/main/patches/xfce4-screensaver/0001-set-default-wallpaper.patch
              cd "$SRCDIR"
              patch -p1 < /build/0001-set-default-wallpaper.patch
              cd /build

          - name: xfdesktop
            enabled: true
            repo: https://gitlab.archlinux.org/archlinux/packaging/packages/xfdesktop.git
            prepare: |
              sed -i 's|--prefix=/usr|--prefix=/usr --with-default-backdrop-filename=/usr/share/backgrounds/frosted-glass.webp|g' ./PKGBUILD

          - name: xfce-aero-lang-changer
            enabled: true
            repo: https://github.com/fiftydinar/xfce-aero-lang-changer.git

          - name: gtk2
            enabled: true
            repo: https://aur.archlinux.org/gtk2.git

          - name: compiz
            enabled: true
            repo: https://aur.archlinux.org/compiz.git
            prepare: |
              awk -i inplace 'BEGIN{rc=1} /-DCOMPIZ_DEFAULT_PLUGINS=/{sub(/-DCOMPIZ_DEFAULT_PLUGINS=.*/,"-DCOMPIZ_DEFAULT_PLUGINS=\"composite,opengl,decor,grid,move,place,regex,resize,snap,text,compiztoolbox,ring,wall,animation,blur,extrawm\""); rc=0} 1; END{exit rc}' ./PKGBUILD
            patch: |
              SRCDIR=$(find "${BUILDDIR:-/build}/src" -maxdepth 1 -type d -name 'compiz*' | head -1)
              [ -n "$SRCDIR" ] || { echo "ERROR: source dir not found"; exit 1; }
              for p in 0001-compiz-defaults 0002-auto-fullscreen 0003-invert-keybindings 0004-fix-ccsm-reset-profile 0005-fix-ccsm-reset-settings 0006-ignore-client-self-minimize 0007-fix-cache-content-hash 0008-set-fullscreen-keybinding; do
                curl -sLO "https://raw.githubusercontent.com/fiftydinar/xfce-aerolike/refs/heads/main/patches/compiz/${p}.patch"
                cd "$SRCDIR"
                patch -p1 -F100 < "/build/${p}.patch"
                cd /build
              done

          - name: xfce4-docklike-plugin-git
            enabled: true
            repo: https://aur.archlinux.org/xfce4-docklike-plugin-git.git

          - name: glycin-ng
            enabled: true
            repo: https://github.com/QaidVoid/glycin-ng.git
            prepare: |
              cp pkgbuilds/glycin-ng/PKGBUILD .

          - name: gtk-nocsd-git
            enabled: true
            repo: https://aur.archlinux.org/gtk-nocsd-git.git
            prepare: |
              sed -i 's|LIBDIR="/usr/lib"|LIBDIR="/usr/lib" NOOPT=1|' ./PKGBUILD

          - name: networkmanager-dispatcher-chrony
            enabled: true
            repo: https://aur.archlinux.org/networkmanager-dispatcher-chrony.git

          - name: oomd-git
            enabled: true
            repo: https://aur.archlinux.org/oomd-git.git

          - name: systemd
            enabled: true
            repo: https://gitlab.archlinux.org/archlinux/packaging/packages/systemd.git
            skippgpcheck: true
            prepare: |
              sed -i 's|rm |rm -f |' ./PKGBUILD
              # Drop the subpackages we don't need. systemd-resolvconf is a
              # dangling symlink (resolvectl) when resolved is disabled;
              # systemd-tests and systemd-ukify are not used at runtime
              # (this image boots GRUB/bootupd, not systemd-boot).
              sed -i "/'systemd-ukify')/s/'systemd-ukify')/)/" ./PKGBUILD
              sed -i "/'systemd-resolvconf'/d; /'systemd-tests'/d" ./PKGBUILD
              sed -i '/^package_systemd-resolvconf() {/,/^}/d; /^package_systemd-tests() {/,/^}/d; /^package_systemd-ukify() {/,/^}/d' ./PKGBUILD
              sed -i "/'systemd-ukify: combine kernel and initrd into a signed Unified Kernel Image'/d" ./PKGBUILD
              sed -i '/^  # ukify shipped in separate package$/,/systemd-ukify\/install.d$/d' ./PKGBUILD
              sed -i '/^  # files shipped with systemd-resolvconf$/,/resolvconf\.1}$/d' ./PKGBUILD
              sed -i '/^  # tests shipped with systemd-tests (for upstream)$/,/mv "\$pkgdir"\/usr\/lib\/systemd\/tests systemd-tests\/$/d' ./PKGBUILD
              # Assertions: if the PKGBUILD edits above didn't take effect
              # (upstream structure changed), fail loudly instead of
              # silently shipping the unwanted subpackages. Use `if` blocks,
              # NOT `grep -q ... && exit 1` -- the latter returns 1 when
              # grep finds nothing (the success case) and trips `set -e`.
              bash -n ./PKGBUILD || { echo "ERROR: systemd PKGBUILD syntax broken after edits"; exit 1; }
              for _sub in systemd-resolvconf systemd-tests systemd-ukify; do
                if grep -q "$_sub" ./PKGBUILD; then
                  echo "ERROR: $_sub still present in PKGBUILD after edits"
                  exit 1
                fi
              done
              echo "MESON_EXTRA_CONFIGURE_OPTIONS=-Dapparmor=disabled -Dbootloader=disabled -Dsysupdated=disabled -Dsysupdate=disabled -Dnss-mymachines=disabled -Dnss-resolve=disabled -Dresolve=false -Dtimesyncd=false -Doomd=false -Dcoredump=false -Dnetworkd=false -Dhomed=disabled -Dportabled=false -Dmachined=false -Dsysext=false -Dnsresourced=false -Dmountfsd=false -Dimportd=disabled -Dvmspawn=disabled -Dstoragetm=false -Dquotacheck=false -Drepart=disabled -Dpstore=false -Dfirstboot=false -Dinstall-tests=false -Dukify=disabled" >> $GITHUB_ENV

          - name: dwarfs-bin
            enabled: true
            repo: https://aur.archlinux.org/dwarfs-bin.git

          - name: yserver-git
            enabled: false
            repo: https://aur.archlinux.org/yserver-git.git

          - name: bcachefs-tools
            enabled: true
            repo: https://gitlab.archlinux.org/archlinux/packaging/packages/bcachefs-tools.git
            skippgpcheck: true
            prepare: |
              BCACHEFS_TAG=$(git ls-remote --tags --refs https://evilpiepirate.org/git/bcachefs-tools.git | grep -o 'v[0-9.]*$' | sort -V | tail -1)
              BCACHEFS_VER=${BCACHEFS_TAG#v}
              # Switch source from GitHub to evilpiepirate (matches kernel module source)
              # Range ends at the closing ') of the b2sums array (which spans two lines)
              sed -i "/^source=(/,/')$/c source=(\"git+https://evilpiepirate.org/git/bcachefs-tools.git#tag=${BCACHEFS_TAG}\")" PKGBUILD
              echo "sha256sums=('SKIP')" >> PKGBUILD
              sed -i "s/^pkgver=.*/pkgver=$BCACHEFS_VER/" PKGBUILD
              # Remove dkms subpackage — kernel module is built separately
              sed -i "/^package_bcachefs-dkms/,/^}/d" PKGBUILD
              sed -i "s|^pkgname=(.*)|pkgname=('bcachefs-tools')|" PKGBUILD
              sed -i '/^pkgrel=/s/=.*/=1/' PKGBUILD
              # Drop valgrind to speed up build
              sed -i '/valgrind/d' PKGBUILD
              # prepare() references a dkms patch no longer in source; neutralize it
              sed -i '/^prepare() {/,/^}/c prepare() {\n  cd ${pkgname}\n}' PKGBUILD


    container:
      image: docker.io/archlinux:latest
      options: --cap-add=SYS_ADMIN --tmpfs /build:size=14G,exec

    steps:
      - name: Prepare build container
        if: ${{ matrix.pkg.enabled }}
        run: |
          pacman -Sy --noconfirm base-devel git sudo pacman-contrib ccache github-cli
          useradd -m builder && echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          mkdir -p /ccache && chown builder:builder /ccache
          sed -i 's/!ccache/ccache/' /etc/makepkg.conf
          sed -i '/^OPTIONS=(/ { s/ !debug//g; s/ debug/ !debug/; }' /etc/makepkg.conf

      - name: Unmount tmpfs for linux
        if: ${{ matrix.pkg.name == 'linux' && matrix.pkg.enabled }}
        run: |
          umount /build && mkdir -p /build

      - name: Configure compiler flags
        if: ${{ matrix.pkg.enabled }}
        run: |
          echo "MAKEFLAGS=-j$(nproc)" >> $GITHUB_ENV
          echo "CCACHE_DIR=/ccache" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
          echo "CFLAGS=-pipe" >> $GITHUB_ENV
          echo "CXXFLAGS=-pipe" >> $GITHUB_ENV
          echo "BUILDDIR=/build" >> $GITHUB_ENV
          echo "CARGO_HOME=/home/builder/.cargo" >> $GITHUB_ENV

      - name: Cache ccache
        if: ${{ matrix.pkg.enabled }}
        id: ccache
        uses: actions/cache@v6
        with:
          path: /ccache
          key: ccache-${{ matrix.pkg.name }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.pkg.name }}-

      - name: Clone ${{ matrix.pkg.name }}
        if: ${{ matrix.pkg.enabled }}
        run: |
          git clone --depth 1 "${{ matrix.pkg.repo }}" /build
          ls -la /build/

      - name: Apply patches
        if: ${{ matrix.pkg.enabled && matrix.pkg.prepare }}
        run: |
          cd /build && ${{ matrix.pkg.prepare }}

      - name: Install official dependencies
        if: ${{ matrix.pkg.enabled }}
        run: |
          cd /build
          . ./PKGBUILD
          pacman -Sy --noconfirm --needed base-devel ${depends[@]} ${makedepends[@]} 2>/dev/null || true

      - name: Build patched package
        if: ${{ matrix.pkg.enabled && matrix.pkg.patch }}
        run: |
          cd /build
          echo "─────────────── Building ${{ matrix.pkg.name }} ───────────────"
          chown -R builder:builder /build
          PGP=""
          [ "${{ matrix.pkg.skippgpcheck }}" = "true" ] && PGP="--skippgpcheck"
          echo "──────────────────── Extracting sources ────────────────────"
          sudo -E -u builder makepkg --noconfirm --syncdeps --nocheck $PGP --nobuild
          echo "────────────────────── Applying patch ──────────────────────"
          ${{ matrix.pkg.patch }}
          echo "───────────────── Building patched package ─────────────────"
          chown -R builder:builder /build
          sudo -E -u builder makepkg --noconfirm --syncdeps --nocheck $PGP --noextract
          echo "────────── Building ${{ matrix.pkg.name }} finished ──────────"

      - name: Build package
        if: ${{ matrix.pkg.enabled && !matrix.pkg.patch }}
        run: |
          cd /build
          echo "─────────────── Building ${{ matrix.pkg.name }} ───────────────"
          chown -R builder:builder /build
          PGP=""
          [ "${{ matrix.pkg.skippgpcheck }}" = "true" ] && PGP="--skippgpcheck"
          sudo -E -u builder makepkg --noconfirm --syncdeps --nocheck $PGP
          echo "────────── Building ${{ matrix.pkg.name }} finished ──────────"

      - name: Sanitize filenames for artifact upload
        if: ${{ matrix.pkg.enabled }}
        run: |
          cd /build
          for f in *.pkg.tar.zst; do
            [ -f "$f" ] || continue
            newf=$(echo "$f" | tr ':' '_')
            [ "$f" = "$newf" ] || mv -v "$f" "$newf"
          done

      - name: Upload package
        if: ${{ matrix.pkg.enabled }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.pkg.name }}
          path: /build/*.pkg.tar.zst
          compression-level: 0

  build-chain:
    name: ${{ matrix.pkg.name }}
    runs-on: ubuntu-latest
    needs: build-foundation
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pkg:
          - name: libwnck
            repo: https://aur.archlinux.org/libwnck.git
            deps: gtk2

          - name: emerald
            repo: https://aur.archlinux.org/emerald.git
            deps: gtk2 libwnck compiz

          - name: glycin-ng-librsvg
            repo: https://github.com/QaidVoid/glycin-ng.git
            deps: glycin-ng
            prepare: |
              cp pkgbuilds/glycin-ng-librsvg/PKGBUILD .

    container:
      image: docker.io/archlinux:latest
      options: --cap-add=SYS_ADMIN --tmpfs /build:size=14G,exec

    steps:
      - name: Prepare build container
        run: |
          pacman -Sy --noconfirm base-devel git sudo pacman-contrib ccache github-cli
          useradd -m builder && echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          mkdir -p /ccache && chown builder:builder /ccache
          sed -i 's/!ccache/ccache/' /etc/makepkg.conf
          sed -i '/^OPTIONS=(/ { s/ !debug//g; s/ debug/ !debug/; }' /etc/makepkg.conf

      - name: Configure compiler flags
        run: |
          echo "MAKEFLAGS=-j$(nproc)" >> $GITHUB_ENV
          echo "CCACHE_DIR=/ccache" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
          echo "CFLAGS=-pipe" >> $GITHUB_ENV
          echo "CXXFLAGS=-pipe" >> $GITHUB_ENV
          echo "BUILDDIR=/build" >> $GITHUB_ENV
          echo "CARGO_HOME=/home/builder/.cargo" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: /ccache
          key: ccache-${{ matrix.pkg.name }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.pkg.name }}-

      - name: Download pre-built AUR deps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deps="${{ matrix.pkg.deps }}"
          [ -z "$deps" ] && exit 0
          mkdir -p /deps
          for dep in $deps; do
            gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --name "$dep" --dir /deps
          done

      - name: Install pre-built AUR deps
        if: ${{ matrix.pkg.deps }}
        run: |
          pacman -U --noconfirm /deps/*.pkg.tar.zst

      - name: Clone ${{ matrix.pkg.name }}
        run: |
          git clone --depth 1 "${{ matrix.pkg.repo }}" /build
          ls -la /build/

      - name: Apply patches
        if: ${{ matrix.pkg.prepare }}
        run: |
          cd /build && ${{ matrix.pkg.prepare }}

      - name: Install official dependencies
        run: |
          cd /build
          . ./PKGBUILD
          pacman -Sy --noconfirm --needed base-devel ${depends[@]} ${makedepends[@]} 2>/dev/null || true

      - name: Build ${{ matrix.pkg.name }}
        run: |
          cd /build
          echo "─────────────── Building ${{ matrix.pkg.name }} ───────────────"
          chown -R builder:builder /build
          sudo -E -u builder makepkg --noconfirm --syncdeps --nocheck
          echo "────────── Building ${{ matrix.pkg.name }} finished ──────────"

      - name: Sanitize filenames for artifact upload
        run: |
          cd /build
          for f in *.pkg.tar.zst; do
            [ -f "$f" ] || continue
            newf=$(echo "$f" | tr ':' '_')
            [ "$f" = "$newf" ] || mv -v "$f" "$newf"
          done

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.pkg.name }}
          path: /build/*.pkg.tar.zst
          compression-level: 0

  publish:
    name: Publish release
    needs: [build-foundation, build-chain]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Prune old releases
        run: |
          gh release list --repo ${{ github.repository }} --limit 100 --json tagName,createdAt \
              --jq '.[].tagName' | sort | \
              head -n -30 | xargs -r -I{} gh release delete {} --repo ${{ github.repository }} --yes --cleanup-tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
      - name: Create release archive
        run: |
          mkdir packages
          echo "## Built packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| # | Package | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          i=1
          for pkgdir in */; do
            [ "$pkgdir" = "packages/" ] && continue
            for pkgfile in "$pkgdir"*.pkg.tar.zst; do
              [ -f "$pkgfile" ] || continue
              pkgname=$(basename "$pkgfile" .pkg.tar.zst)
              size=$(du -h "$pkgfile" | cut -f1)
              cp "$pkgfile" packages/
              echo "| $i | $pkgname | $size |" >> $GITHUB_STEP_SUMMARY
              i=$((i + 1))
            done
          done
          tar -czf xfce-aerolike-packages.tar.gz packages/
      - name: Delete old packages release and its assets
        run: |
          # Delete all existing assets from the packages release first
          ASSETS=$(gh api "repos/${{ github.repository }}/releases/tags/packages" --jq '.assets[]?.id' 2>/dev/null || true)
          for id in $ASSETS; do
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" 2>/dev/null || true
          done
          # Delete the release and tag entirely
          gh release delete packages --yes --cleanup-tag 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: packages
          files: |
            xfce-aerolike-packages.tar.gz
            packages/*.pkg.tar.zst
      - name: Trigger bluebuild
        if: github.event_name == 'schedule'
        run: gh workflow run build.yml --ref main --repo "${{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
