name: Build ISO
on:
  workflow_dispatch:
  push:
    paths:
      - 'iso/**'
      - '.github/workflows/build-iso.yml'
      - 'recipes/recipe.yml'
  schedule:
    - cron: '0 6 * * 0'  # weekly Sunday

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-calamares:
    name: Build Calamares
    runs-on: ubuntu-latest
    container:
      image: docker.io/archlinux:latest
      options: --cap-add=SYS_ADMIN
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          pacman-key --init
          pacman-key --populate
          pacman -Syu --noconfirm base-devel cmake extra-cmake-modules \
            qt6-base qt6-svg qt6-tools kpmcore yaml-cpp python boost \
            polkit-qt6 git

      - name: Build Calamares
        run: |
          git clone --depth 1 --branch v3.4.2 https://codeberg.org/calamares/calamares.git /tmp/calamares
          cd /tmp/calamares
          mkdir build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release \
            -DWITH_QML=OFF -DWITH_QT6=ON -DINSTALL_CONFIG=ON
          make -j$(nproc)
          mkdir -p /tmp/pkg
          make DESTDIR=/tmp/pkg install
          cd /tmp/pkg
          tar -czf /tmp/calamares-package.tar.gz .

      - name: Upload Calamares artifact
        uses: actions/upload-artifact@v4
        with:
          name: calamares-package
          path: /tmp/calamares-package.tar.gz
          retention-days: 7

  build-iso:
    name: Build ISO
    runs-on: ubuntu-latest
    needs: build-calamares
    container:
      image: docker.io/archlinux:latest
      options: --privileged
    env:
      CONTAINERS_STORAGE_DRIVER: vfs
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: calamares-package
          path: /tmp/calamares-package

      - name: Set up environment
        run: |
          pacman-key --init
          pacman-key --populate
          # archiso provides mkarchiso, podman/skopeo for container ops
          pacman -Syu --noconfirm archiso podman squashfs-tools zstd skopeo
          # Force VFS storage driver — overlayfs cannot stack on GitHub runner's overlayfs
          mkdir -p /etc/containers
          printf '[storage]\ndriver = "vfs"\n' > /etc/containers/storage.conf
          echo "CALAMARES_PKG=/tmp/calamares-package/calamares-package.tar.gz" >> $GITHUB_ENV

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build ISO
        run: |
          ./iso/build-iso.sh \
            --image "ghcr.io/fiftydinar/xfce-aerolike:latest" \
            --calamares-pkg "$CALAMARES_PKG" \
            --out ./iso-out

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: xfce-aerolike-iso
          path: ./iso-out/*.iso
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          name: "xfce-aerolike ISO ${{ github.run_number }}"
          tag_name: iso-${{ github.run_number }}
          files: ./iso-out/*.iso
          generate_release_notes: true
