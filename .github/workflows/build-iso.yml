name: Build ISO
on:
  workflow_dispatch:
  push:
    paths:
      - 'iso/**'
      - '.github/workflows/build-iso.yml'
      - 'recipes/recipe.yml'
  schedule:
    - cron: '0 6 * * *'  # daily

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-calamares:
    name: Build Calamares
    runs-on: ubuntu-latest
    container:
      image: docker.io/archlinux:latest
      options: --cap-add=SYS_ADMIN
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps
        run: |
          pacman-key --init
          pacman-key --populate
          pacman -Syu --noconfirm base-devel cmake extra-cmake-modules \
            qt6-base qt6-svg qt6-tools kpmcore yaml-cpp python boost \
            polkit-qt6 git

      - name: Build Calamares
        run: |
          git clone --depth 1 --branch v3.4.2 https://codeberg.org/calamares/calamares.git /tmp/calamares
          cd /tmp/calamares
          git apply "$GITHUB_WORKSPACE/patches/calamares-bcachefs.patch"
          git apply "$GITHUB_WORKSPACE/patches/calamares-bcachefs-boot-part.patch"
          cp -r "$GITHUB_WORKSPACE/patches/calamares-installmode" src/modules/installmode
          mkdir build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release \
            -DWITH_QML=OFF -DWITH_QT6=ON -DINSTALL_CONFIG=ON
          make -j$(nproc)
          mkdir -p /tmp/pkg
          make DESTDIR=/tmp/pkg install
          cd /tmp/pkg
          tar -czf /tmp/calamares-package.tar.gz .

      - name: Upload Calamares artifact
        uses: actions/upload-artifact@v7
        with:
          name: calamares-package
          path: /tmp/calamares-package.tar.gz
          retention-days: 7

  build-iso:
    name: Build ISO
    runs-on: ubuntu-latest
    needs: build-calamares
    container:
      image: docker.io/archlinux:latest
      options: --privileged
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: calamares-package
          path: /tmp/calamares-package

      - name: Set up environment
        run: |
          pacman-key --init
          pacman-key --populate
          # Ensure pacman DBPath exists (newer pacman resolves DBPath at startup)
          mkdir -p /usr/lib/sysimage/lib/pacman
          # archiso provides mkarchiso, podman for container ops
          # fuse-overlayfs lets overlay work on top of the CI runner's overlayfs
          pacman -Syu --noconfirm archiso grub dosfstools mtools syslinux podman squashfs-tools zstd skopeo fuse-overlayfs jq
          # Use fuse-overlayfs as the mount program — this works on top of the
          # GitHub runner's overlayfs (unlike kernel overlay), and avoids the
          # disk-space blowup of VFS and the layer-depth limit of Docker.
          printf '#!/bin/sh\nexec /usr/bin/podman --storage-driver overlay --storage-opt overlay.mount_program=/usr/bin/fuse-overlayfs "$@"\n' > /usr/local/bin/podman
          chmod +x /usr/local/bin/podman
          echo "CALAMARES_PKG=/tmp/calamares-package/calamares-package.tar.gz" >> $GITHUB_ENV

      - name: Log in to GHCR
        run: |
          # skopeo login doesn't need storage initialization (unlike podman login)
          echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build ISO
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            IMAGE_TAG="latest"
            ISO_VERSION_SUFFIX=""
          else
            IMAGE_TAG=$(skopeo list-tags "docker://ghcr.io/fiftydinar/xfce-aerolike" | jq -r '.Tags[] | select(. | startswith("br-${{ github.ref_name }}-"))' | sort -r | head -1)
            if [ -z "$IMAGE_TAG" ]; then
              echo "ERROR: no image found for branch ${{ github.ref_name }}"
              exit 1
            fi
            ISO_VERSION_SUFFIX="-${{ github.ref_name }}"
          fi
          echo "Using image tag: ${IMAGE_TAG}"
          export ISO_VERSION_SUFFIX
          ./iso/build-iso.sh \
            --image "ghcr.io/fiftydinar/xfce-aerolike:${IMAGE_TAG}" \
            --calamares-pkg "$CALAMARES_PKG" \
            --out ./iso-out

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: xfce-aerolike-iso
          path: ./iso-out/*
          retention-days: 30

      - name: Prepare ISO for release (split if >2GiB)
        id: iso
        run: |
          echo "tag=iso-${{ github.ref_name }}-$(date +%Y%m%d)-${{ github.run_id }}" >> $GITHUB_OUTPUT
          ISO_FILE=$(ls ./iso-out/*.iso 2>/dev/null | head -1)
          if [ -z "$ISO_FILE" ]; then
            exit 0
          fi
          ISO_SIZE=$(stat -c%s "$ISO_FILE")
          ISO_BASENAME=$(basename "$ISO_FILE")
          # GitHub release limit is 2 GiB per file
          if [ "$ISO_SIZE" -gt 2147483648 ]; then
            echo "[release] ISO exceeds 2GiB, splitting into ~1.5GiB chunks..."
            split -b 1500M --numeric-suffixes=1 --suffix-length=2 \
              "$ISO_FILE" "./iso-out/${ISO_BASENAME}.part"
            rm -f "$ISO_FILE"
            cd ./iso-out && sha256sum "${ISO_BASENAME}.part"?? > "${ISO_BASENAME}.part.sha256"
            cd "$OLDPWD"
            printf '#!/bin/sh\nset -eu\nSCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"\n' > ./iso-out/"${ISO_BASENAME}".reassemble.sh
            printf 'ISO_BASENAME="$(basename "$0" .reassemble.sh)"\n' >> ./iso-out/"${ISO_BASENAME}".reassemble.sh
            printf 'echo "Reassembling ${ISO_BASENAME}..."\n' >> ./iso-out/"${ISO_BASENAME}".reassemble.sh
            printf 'sha256sum -c "${SCRIPT_DIR}/${ISO_BASENAME}.part.sha256"\n' >> ./iso-out/"${ISO_BASENAME}".reassemble.sh
            printf 'cat "${SCRIPT_DIR}/${ISO_BASENAME}.part"?? > "${SCRIPT_DIR}/${ISO_BASENAME}"\n' >> ./iso-out/"${ISO_BASENAME}".reassemble.sh
            printf 'echo "Done: ${SCRIPT_DIR}/${ISO_BASENAME}"\n' >> ./iso-out/"${ISO_BASENAME}".reassemble.sh
            chmod +x ./iso-out/"${ISO_BASENAME}".reassemble.sh
          fi

      - name: Delete old ISO releases (keep 30)
        run: |
          API_URL="https://api.github.com/repos/${{ github.repository }}/releases?per_page=100"
          curl -sS -H "Authorization: token ${{ github.token }}" "$API_URL" \
            | jq -r '.[] | select(.tag_name | startswith("iso-${{ github.ref_name }}-")) | "\(.id) \(.tag_name)"' \
            | sort -r | tail -n +31 | while read id tag; do
              echo "Deleting release $id ($tag)..."
              curl -sS -X DELETE -H "Authorization: token ${{ github.token }}" \
                "https://api.github.com/repos/${{ github.repository }}/releases/$id"
              curl -sS -X DELETE -H "Authorization: token ${{ github.token }}" \
                "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$tag"
            done

      - name: Create ISO release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.iso.outputs.tag }}
          name: xfce-aerolike ${{ github.ref_name }} ${{ steps.iso.outputs.tag }}
          files: ./iso-out/*
          fail_on_unmatched_files: false


