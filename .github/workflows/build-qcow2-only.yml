name: Build disk image
on: workflow_dispatch
jobs:
  qcow2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo podman build -t xfce-aerolike-disk -f Containerfile.disk .
      - run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 --rootfs ext4 localhost/xfce-aerolike-disk
      - run: zstd -T0 -19 output/qcow2/disk.qcow2 -o xfce-aerolike.qcow2.zst
      - uses: actions/upload-artifact@v4
        with:
          name: xfce-aerolike-disk
          path: xfce-aerolike.qcow2.zst
          compression-level: 0