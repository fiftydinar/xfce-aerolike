LABEL arch
TEXT HELP
Boot the xfce-aerolike live environment on BIOS.
It allows you to try xfce-aerolike or install it to disk.
ENDTEXT
MENU LABEL xfce-aerolike live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%
