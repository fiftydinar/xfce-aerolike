---
modules-search: [ local ]

instances:
  - module: bootc-install
    id: bootc-install

sequence:
- show:
  - welcome
  - installmode
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - bootc-install@bootc-install
  - umount
- show:
  - finished

branding: xfce-aerolike
prompt-install: true
dont-chroot: true
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
