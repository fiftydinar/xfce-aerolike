---
modules-search: [ local ]

instances:
  - module: bootc-extract
    id: bootc-extract
  - module: bootc-deploy
    id: bootc-deploy
  - module: bootc-sysconfig
    id: bootc-sysconfig
  - module: bootc-users
    id: bootc-users

sequence:
- show:
  - welcome
  - installmode
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - bootc-extract
  - bootc-deploy
  - bootc-sysconfig
  - bootc-users
  - umount
- show:
  - finished

branding: xfce-aerolike
prompt-install: true
dont-chroot: true
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
