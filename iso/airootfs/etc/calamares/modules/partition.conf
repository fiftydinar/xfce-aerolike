---
createHybridBootloaderLayout: true
enableLuksAutomatedPartitioning: false

efi:
    mountPoint: "/boot/efi"
    recommendedSize: 300MiB
    minimumSize: 32MiB
    label: "EFI"

# Swap is handled by the built-in swapfile-setup.service + var-swapfile.swap
# (a low-priority disk swap on /var/swapfile, zram remains primary).
# Calamares' own swap choices (small/suspend/file) do not work in this
# bootc flow -- the fstab module that creates/enables them is not run --
# so only "none" is offered and the systemd units take over.
userSwapChoices:
    - none

luksGeneration: luks1
drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: none
initialSwapChoice: none

defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "xfs", "bcachefs"]


essentialMounts: [ "live-*", "control", "ventoy" ]
