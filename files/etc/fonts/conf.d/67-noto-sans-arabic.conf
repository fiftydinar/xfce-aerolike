<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Ensures Noto Sans Arabic is preferred for Arabic text when using
  generic sans-serif family, overriding legacy fallback fonts from
  65-nonlatin.conf and 65-fonts-persian.conf.
  Equivalent to Fedora's 56-google-noto-sans-arabic-vf.conf.
-->
<fontconfig>
  <match>
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Sans Arabic</string>
    </edit>
  </match>
  <alias>
    <family>Noto Sans Arabic</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
</fontconfig>
