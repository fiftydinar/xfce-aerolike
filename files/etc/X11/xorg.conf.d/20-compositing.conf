Section "Device"
    Identifier      "*"
    # Server-side compositing is disabled so that compiz does the compositing.
    #
    # This image runs dec05eba's Xorg fork ("phoenix"), whose modesetting
    # driver composites in the X server by default and takes ownership of the
    # _NET_WM_CM_S<screen> selection. Compiz's composite plugin redirects the
    # root window itself with XCompositeRedirectSubwindows(CompositeRedirect-
    # Manual); the server's own redirect is Automatic, and only one Manual
    # redirect is allowed, so compiz would succeed, believe it is the only
    # compositor, and composite on top of the server's compositing. That is
    # double compositing, which the fork does not support.
    #
    # With compositing off, compiz composites as it does on upstream Xorg, and
    # the fork still gives per-monitor framebuffers, tear-free output, direct
    # scanout of matching fullscreen windows and HDR. What this gives up is
    # server-side synchronized window resizing, _NET_WM_FRAME_DRAWN/_NET_WM_
    # FRAME_TIMINGS and overlay planes -- compiz trades those for its own
    # effects, which is the point of this desktop.
    #
    # This replaces the previous "TearFree" "true" setting: TearFree is the
    # old name of this same option in the fork (still accepted, deprecated,
    # and Compositing wins if both are set), so leaving it would silently
    # re-enable server compositing and take compositing away from compiz.
    Option          "Compositing" "false"
EndSection
