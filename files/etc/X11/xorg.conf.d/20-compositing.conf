Section "Device"
    Identifier      "*"
    # Server-side compositing is disabled so that compiz does the compositing.
    #
    # This image runs dec05eba's Xorg fork ("phoenix"), whose modesetting
    # driver composites in the X server by default and takes ownership of the
    # _NET_WM_CM_S<screen> selection. Compiz's composite plugin redirects the
    # root window itself with XCompositeRedirectSubwindows(CompositeRedirect-
    # Manual); the server's own redirect is Automatic, and only one Manual
    # redirect is allowed, so compiz would succeed, believe it is the only
    # compositor, and composite on top of the server's compositing. That is
    # double compositing, which the fork does not support.
    #
    # With compositing off, compiz composites as it does on upstream Xorg.
    # What the fork still provides in this mode: per-monitor framebuffers,
    # tear-free output (changed parts are copied to each monitor's framebuffer
    # at vblank), per-monitor DPI, faster X11 rendering and high-priority
    # server threads.
    #
    # What is NOT available in this mode, verified in the fork's source:
    #
    #   - Direct scanout of application windows. compServerCanDefer() requires
    #     CompositeIsServerRedirected(), which requires redirectDraw ==
    #     RedirectDrawAutomatic and no non-server clients on the window. Compiz
    #     redirects toplevels Manual, so windows never enter the server's
    #     directWindows list, and with compositing off compServerScanoutWindow()
    #     only looks at that list. Compiz unredirecting a fullscreen window does
    #     not help either: redirectDraw becomes None, still not Automatic.
    #   - Overlay planes, _NET_WM_FRAME_DRAWN and _NET_WM_FRAME_TIMINGS.
    #   - Per-window HDR tone mapping. PaintHdr is called from
    #     compServerPaintLayer(), i.e. the fork's own paint path, so it does not
    #     run for windows a foreign compositor draws. HDR content will be shown
    #     the way compiz draws it (SDR).
    #
    # The fork's HiddenWindowFPS throttling is also inert here:
    # CompositeServerWindowHidden() returns FALSE when a window is not viewable
    # and compServerWindowCaptured() returns TRUE as soon as a non-server client
    # has redirected the window, which compiz always does.
    #
    # Turning compositing back on to get scanout and HDR is not an option while
    # this desktop keeps compiz: decor, move, resize, place, snap, compiztoolbox
    # and extrawm all hard-require the composite plugin, so compiz cannot run as
    # a window manager without it, and running it alongside the fork's
    # compositing double-composites as described above. HDR and the compiz-based
    # Aero look are mutually exclusive; the look was chosen deliberately.
    #
    # This replaces the previous "TearFree" "true" setting: TearFree is the
    # old name of this same option in the fork (still accepted, deprecated,
    # and Compositing wins if both are set), so leaving it would silently
    # re-enable server compositing and take compositing away from compiz.
    Option          "Compositing" "false"
EndSection
