Section "Device"
    Identifier      "*"
    # Server-side compositing is disabled so that compiz can composite.
    #
    # This image runs dec05eba's Xorg fork ("phoenix"), whose modesetting driver
    # composites in the X server by default and then claims the
    # _NET_WM_CM_S<screen> selection (compServerClaimCmSelection, gated on
    # server->compositing).
    #
    # What happens if that is left on: compiz does check, in
    # plugins/composite/src/screen.cpp (PrivateCompositeScreen::init), by calling
    # XGetSelectionOwner on _NET_WM_CM_S<screen>. Finding the fork's server as
    # the owner it logs
    #   "Screen 0 ... already has a compositing manager (0x...); try using the
    #    --replace option to replace the current compositing manager."
    # and calls setFailed(), so the composite plugin does not load. Since decor,
    # move, resize, place, snap, compiztoolbox and extrawm all hard-require the
    # composite plugin, the session comes up without a working window manager -
    # a loud failure, not a subtle one. Running compiz with --replace instead
    # would take the selection over and leave BOTH compositing, which the fork
    # does not support.
    #
    # With compositing off the server does not claim the selection, so compiz
    # claims it as it does on upstream Xorg. That is also what makes
    # gdk_screen_is_composited() (and the Qt equivalent) report a compositor, so
    # GTK/Qt applications keep using ARGB visuals and transparency keeps
    # working. The fork explicitly supports this arrangement: compCheckRedirect
    # says "Never redirect the overlay window, unless the server composites it",
    # so the overlay window compiz draws into via XCompositeGetOverlayWindow is
    # passed straight through. The fork documents the same arrangement for picom.
    #
    # What the fork still provides in this mode: per-monitor framebuffers,
    # tear-free output (changed parts are copied to each monitor's framebuffer
    # at vblank), per-monitor DPI, faster X11 rendering and high-priority server
    # threads.
    #
    # What is NOT available in this mode:
    #
    #   - HDR. compiz composites every window into the overlay window it gets
    #     from XCompositeGetOverlayWindow, which inherits the root window's
    #     depth, so the whole desktop is 8 bits per channel before it reaches
    #     the screen. Per-window tone mapping lives in the fork's own paint path
    #     (compServerPaintLayer calls PaintHdr), which does not run for a foreign
    #     compositor. HDR cannot work with compiz at all, by construction.
    #   - Direct scanout of application windows through the fork's deferred /
    #     sublayer path: compServerCanDefer requires CompositeIsServerRedirected,
    #     which requires redirectDraw == RedirectDrawAutomatic with no non-server
    #     clients on the window, and compiz redirects toplevels Manual.
    #   - Overlay planes, _NET_WM_FRAME_DRAWN and _NET_WM_FRAME_TIMINGS.
    #   - The fork's HiddenWindowFPS throttling is inert here too:
    #     CompositeServerWindowHidden returns FALSE for non-viewable windows and
    #     compServerWindowCaptured returns TRUE as soon as a non-server client
    #     has redirected the window, which compiz always does.
    #
    # Turning compositing back on is therefore not an option while this desktop
    # keeps compiz, and HDR plus the compiz-based Aero look are mutually
    # exclusive. The look was chosen deliberately.
    #
    # This replaces the previous "TearFree" "true" setting: TearFree is the old
    # name of this same option in the fork (still accepted, deprecated, and
    # Compositing wins if both are set), so leaving it would have silently
    # re-enabled server compositing.
    Option          "Compositing" "false"
EndSection
