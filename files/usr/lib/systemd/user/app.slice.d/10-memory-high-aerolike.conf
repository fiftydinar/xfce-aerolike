# Soft memory ceiling for the user app slice (Flatpak apps and
# systemd-run --user --scope units land here). MemoryHigh throttles
# (reclaims file cache, slows allocation) instead of killing, preventing
# one sandboxed app from silently dragging the whole session into PSI
# pressure territory where oomd has to act. Relative to physical RAM;
# only active while processes exist in this slice, so it is a no-op when
# Flatpak is not installed/used.
[Slice]
MemoryHigh=90%
