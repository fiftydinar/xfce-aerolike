[Service]
# unbound runs as root initially but CapabilityBoundingSet excludes
# CAP_DAC_OVERRIDE, so root can't read files it doesn't own.
# Cert ownership is fixed by unbound-cert-setup.service (root:unbound).
#
# Also clear chroot-related mount directives that are unnecessary
# with chroot: "" and may interfere with direct file access.
TemporaryFileSystem=
BindReadOnlyPaths=
BindPaths=
