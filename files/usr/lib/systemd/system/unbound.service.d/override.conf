[Service]
# CapabilityBoundingSet excludes CAP_DAC_OVERRIDE by default, so
# root can't read files it doesn't own.  Certs are unbound:unbound
# 600 from unbound-control-setup; root needs to read them during
# startup before the privilege drop to the unbound user.
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_SETGID CAP_SETUID CAP_SYS_CHROOT CAP_SYS_RESOURCE CAP_NET_ADMIN CAP_DAC_OVERRIDE
# Also clear chroot-related mount directives that are unnecessary
# with chroot: "" and may interfere with direct file access.
TemporaryFileSystem=
BindReadOnlyPaths=
BindPaths=
