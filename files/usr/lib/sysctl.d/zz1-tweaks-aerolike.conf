fs.inotify.max_user_instances=8192
fs.inotify.max_user_watches=524288

# Disable split lock mitigate (prevents certain games performance drop)
kernel.split_lock_mitigate=0

# ZRAM tweaks (PopOS defaults).
# vm.swappiness is workload-adaptive and owned by adaptive-scheduler
# (lowers it as zram fills, and raises its floor when a disk swap is
# present); vm.watermark_scale_factor is RAM-dependent and set by
# memory-tweaks-aerolike.service. Neither is set here.
# vm.page-cluster=0 is the zram-only default; adaptive-scheduler flips it
# to 3 at runtime when a disk swap device is active.
vm.watermark_boost_factor=0
vm.page-cluster=0

# Increase memory maps (SteamOS default)
vm.max_map_count=2147483642

# https://gist.github.com/ahydronous/7ceaa00df96ef99131600edd4c2c73f2#file-vm-settings-L30
# https://gitlab.com/cscs/maxperfwiz
# Lowering it from the default value of 100 makes the kernel less inclined to reclaim VFS cache, improved responsiveness
# "66" is between Arch (50) and Maxperfwiz (75) optimum, "0" causes Out of Memory errors
vm.vfs_cache_pressure=66

# Use BBR network TCP convestion algorithm
net.ipv4.tcp_congestion_control=bbr

# Disable coredump
kernel.core_pattern = |/bin/false
