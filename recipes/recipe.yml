name: xfce-aerolike
description: XFCE with Aero-like theme.
base-image: ghcr.io/fiftydinar/arch-bootc
image-version: latest

modules:
  - type: pacman
    install:
      packages:
        # GPU acceleration - OpenGL, Vulkan, video decoding/encoding (I won't cover proprietary Nvidia by default)
        - mesa
        - vulkan-radeon
        - vulkan-intel
        - vulkan-nouveau
        - vulkan-swrast
        - libva-intel-driver
        - intel-media-driver
        - libvpl
        - vpl-gpu-rt
        - intel-media-sdk
        # Audio
        - pipewire
        - pipewire-audio
        - pipewire-alsa
        - pipewire-pulse
        - pipewire-jack
        - pipewire-libcamera
        - pipewire-v4l2
        - pipewire-ffado
        # Time-sync
        - chrony
        # Network
        - networkmanager
        - wget
        # Bluetooth
        - bluez
        - bluez-obex
        - bluez-mesh
        - bluez-utils
        # Virtual machines
        - virtualbox-guest-utils
        - qemu-guest-agent
        - spice-vdagent
        - phodav
        # Containers
        - distrobox
        # Font
        - noto-fonts
        - noto-fonts-cjk
        - noto-fonts-emoji
        - noto-fonts-extra
        # Desktop environment
        - xfce4
        - xfce4-screenshooter
        - obsidian-icon-theme
        - kvantum-qt5
        - kvantum
        - qt5ct
        - qt6ct
        - xorg
        - xorg-drivers
        - lightdm
        - lightdm-gtk-greeter
        - pavucontrol
        - network-manager-applet
        - blueman
        - xfce4-whiskermenu-plugin
        - xfce4-pulseaudio-plugin
        - xfce4-docklike-plugin
        - xfce4-xkb-plugin
        - thunar-archive-plugin
        - xdg-user-dirs
        - gvfs
        - gvfs-mtp
        - zram-generator
        # CLI editor
        - nano
        # Archives GUI
        - xarchiver
        # AppImage thumbnailer dependencies
        - squashfuse
        - imagemagick
        # usb-storage-optimized-async dependencies
        - usbutils
        - bc
        # Debugging
        - strace
        - libva-utils
        - mesa-utils
        - vulkan-tools
        - clinfo
        - xdotool
        # DNS resolver (replaces systemd-resolved)
        - unbound
        - avahi
        - nss-mdns
        # OOM prevention
        - jsoncpp
        # Other
        - expac
        - dash
  - type: script
    snippets:
      # Install all optional dependencies for xarchiver
      - "pacman -Syu --needed --noconfirm --asdeps $(expac -Ss '%o' xarchiver)"
      # Symlink dash to sh with pacman hook to persist across bash updates
      - "ln -sfT /usr/bin/dash /usr/bin/sh"
      - |
        cat > /usr/share/libalpm/hooks/dashbinsh.hook << 'HOOK'
        [Trigger]
        Type = Package
        Operation = Install
        Operation = Upgrade
        Target = bash

        [Action]
        Description = Re-pointing /bin/sh symlink to dash...
        When = PostTransaction
        Exec = /usr/bin/ln -sfT dash /usr/bin/sh
        Depends = dash
        HOOK
      # Fix dracut's lib hang on finding root device due to dash's hex escape
      - |
        sed -i 's/echo "\$hook"/printf '\''%s\\n'\'' "$hook"/g' /usr/lib/dracut/modules.d/80base/dracut-lib.sh
      # Download and install pre-built packages (avoids 1+ hour of compilation per build)
      - |
        PKGS_URL="https://github.com/fiftydinar/xfce-aerolike/releases/latest/download/xfce-aerolike-packages.tar.gz"
        wget --retry-connrefused --tries=10 "$PKGS_URL" -O /tmp/pkgs.tar.gz && tar -xzf /tmp/pkgs.tar.gz -C /tmp/
        pacman -U --noconfirm --ask 4 /tmp/packages/*.pkg.tar.zst
        rm -rf /tmp/packages/ /tmp/pkgs.tar.gz
      # Build yserver from source if not in pre-built packages (needed for testing non-main branches)
      - |
        if ! command -v yserver &>/dev/null; then
          pacman -S --noconfirm --needed --assume-installed xorg-server rust just shaderc pkgconf git seatd libxkbcommon libinput systemd-libs fontconfig libxshmfence freetype2
          git clone --depth 1 https://github.com/joske/yserver.git /tmp/yserver-src
          cd /tmp/yserver-src
          cargo build --release
          install -Dm755 target/release/yserver /usr/bin/yserver
          cd /
          rm -rf /tmp/yserver-src /root/.cargo /root/.rustup /root/.cache
          pacman -Rns --noconfirm rust just git || true
        fi
      # Set compiz to use emerald decorator
      - |
        sed -i 's|USE_EMERALD="no"|USE_EMERALD="yes"|g' /usr/bin/compiz-decorator
      # Install AppImage Thumbnailer (sat)
      - "wget --retry-connrefused --tries=30 -O /usr/bin/sat https://raw.githubusercontent.com/Samueru-sama/simple-appimage-thumbnailer/refs/heads/main/sat.sh && chmod +x /usr/bin/sat && wget --retry-connrefused --tries=30 --directory-prefix=/usr/share/thumbnailers https://raw.githubusercontent.com/Samueru-sama/simple-appimage-thumbnailer/refs/heads/main/simple-appimage-thumbnailer.thumbnailer"
      # Install AppImage Sandbox (sas)
      - "wget --retry-connrefused --tries=30 -O /usr/bin/sas https://raw.githubusercontent.com/Samueru-sama/simple-appimage-sandbox/refs/heads/main/sas.sh && chmod +x /usr/bin/sas"
      # Install usb-storage-optimized-async
      - "wget --retry-connrefused --tries=30 https://raw.githubusercontent.com/fiftydinar/usb-storage-optimized-async/refs/heads/main/usb-storage-optimized-async-service -O /usr/bin/usb-storage-optimized-async-service && chmod +x /usr/bin/usb-storage-optimized-async-service && wget --tries=30 --retry-connrefused https://raw.githubusercontent.com/fiftydinar/usb-storage-optimized-async/refs/heads/main/usb-storage-optimized-async-udev -O /usr/bin/usb-storage-optimized-async-udev && chmod +x /usr/bin/usb-storage-optimized-async-udev && wget --tries=30 --retry-connrefused https://raw.githubusercontent.com/fiftydinar/usb-storage-optimized-async/refs/heads/main/usb-storage-optimized-async-service.service -O /usr/lib/systemd/system/usb-storage-optimized-async-service.service && wget --tries=30 --retry-connrefused https://raw.githubusercontent.com/fiftydinar/usb-storage-optimized-async/refs/heads/main/zz1-usb-storage-optimized-async-udev.rules -O /usr/lib/udev/rules.d/zz1-usb-storage-optimized-async-udev.rules && systemctl --system enable usb-storage-optimized-async-service.service"
      # Sudo for wheel group
      - |
        sed -i 's/^# %wheel ALL=(ALL:ALL) ALL/%wheel ALL=(ALL:ALL) ALL/' /etc/sudoers || echo "%wheel ALL=(ALL:ALL) ALL" >> /etc/sudoers
      # Set default language to English and generate locale
      - |
        sed -i 's/^# *\([a-z]\+\_[A-Z]\+.*\)/\1/' /etc/locale.gen
      - "locale-gen"
      - "echo 'LANG=en_US.UTF-8' > /etc/locale.conf"
      # Set nano as the default editor
      - "echo 'VISUAL=nano\nEDITOR=nano' >> /etc/environment"
      # Download and install aerothemeplasma Kvantum theme
      - "wget --retry-connrefused --tries=30 https://gitgud.io/aeroshell/atp/aerothemeplasma/-/raw/HEAD/misc/kvantum/Windows7Aero/Windows7Aero.kvconfig -P /usr/share/Kvantum/Windows7Aero && wget --retry-connrefused --tries=30 https://gitgud.io/aeroshell/atp/aerothemeplasma/-/raw/HEAD/misc/kvantum/Windows7Aero/Windows7Aero.svg -P /usr/share/Kvantum/Windows7Aero"
      # Set gtk-nocsd by default
      - "echo 'LD_PRELOAD=/usr/lib/libgtk-nocsd.so' >> /etc/environment"
      - "echo 'SHARUN_ALLOW_LD_PRELOAD=1' >> /etc/environment"
      - "echo 'QT_QPA_PLATFORMTHEME=qt5ct' >> /etc/environment"
      - "echo 'COMPIZ_CONFIG_PROFILE=aerolike' >> /etc/environment"
      # Set compiz as the default window manager and compositor
      - |
        sed -i 's/value="xfwm4"/value="compiz"/g' /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-session.xml
      - "echo 'Hidden=true' >> /usr/share/applications/xfce-wm-settings.desktop"
      - "echo 'Hidden=true' >> /usr/share/applications/xfce-wmtweaks-settings.desktop"
      - "sed -i 's|Exec=nm-applet|Exec=nm-applet --indicator|g' /etc/xdg/autostart/nm-applet.desktop"
      # Apply XFCE theme defaults
      - |
        sed -i 's|<property name="ThemeName" type="string" value=".*"/>|<property name="ThemeName" type="string" value="Aerolike"/>|' /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
      - |
        sed -i 's|<property name="IconThemeName" type="string" value=".*"/>|<property name="IconThemeName" type="string" value="Obsidian-Teal"/>|' /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
      - |
        sed -i 's|<property name="CursorThemeName" type="string" value=".*"/>|<property name="CursorThemeName" type="string" value="aero-drop"/>|' /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
      - |
        sed -i 's|<property name="FontName" type="string" value=".*"/>|<property name="FontName" type="string" value="Noto Sans 9"/>|' /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
      - |
        sed -i 's|<property name="MonospaceFontName" type="string" value=".*"/>|<property name="MonospaceFontName" type="string" value="Noto Sans Mono 9"/>|' /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
      # Modify LightDM defaults
      - "echo '\n\ntheme-name=Aerolike\nicon-theme-name=Obsidian-Teal\ncursor-theme-name=aero-drop\nfont-name=Noto Sans\nbackground=/usr/share/backgrounds/frosted-glass.webp' >> /etc/lightdm/lightdm-gtk-greeter.conf"
      # Configure nsswitch for mDNS (replace systemd-resolved nss with avahi)
      - |
        sed -i 's/^hosts:.*/hosts: files mymachines myhostname mdns_minimal [NOTFOUND=return] dns/' /etc/nsswitch.conf
      # Generate unbound-control TLS certificates for VPN split-DNS dispatcher
      - "unbound-control-setup"
      # Fix unbound permissions (runs as unbound user, needs write access to root.key)
      - "chown -R unbound:unbound /etc/unbound"
      # Remove D-Bus activation for systemd-resolved (masked units can still be D-Bus activated)
      - "rm -f /usr/share/dbus-1/system-services/org.freedesktop.resolve1.service"
  - type: systemd
    system:
      masked:
        - systemd-timesyncd.service
        - systemd-resolved.service
        - systemd-resolved.socket
        - systemd-resolved-varlink.socket
        - systemd-resolved-monitor.socket
        - systemd-oomd.service
      enabled:
        - NetworkManager.service
        - unbound.service
        - chronyd.service
        - avahi-daemon.service
        - bluetooth.service
        - lightdm.service
        - oomd.service
  - type: files
    files:
      - source: usr
        destination: /usr
      - source: etc
        destination: /etc
  - type: systemd
    system:
      enabled:
        - bootc-fetch-apply-updates.timer
        - memory-tweaks-aerolike.service
        - dirty-centisecs-aerolike.service
        - fix-resolv-conf.service
        - unbound-anchor.service
  - type: signing
  - type: script
    snippets:
      - |
        dracut --force "$(find /usr/lib/modules -maxdepth 1 -type d | grep -v "\.img$" | tail -n 1)"/initramfs.img
      - |
        LC_ALL=C pacman -Qi | awk '/^Name/ {p=$3} /^Installed Size/ {s=$4; u=$5; if(u=="B") s/=1048576; else if(u=="KiB") s/=1024; else if(u=="GiB") s*=1024; t+=s; printf "%015.2f\t%-35s %.2f MiB\n", s, p, s} END {printf "%015.2f\t%s\n", 999999999.98, "────────────────────────────────────────────────"; printf "%015.2f\t%-35s %.2f MiB\n", 999999999.99, "TOTAL:", t}' | sort -n | cut -f2-
      - "pacman -Scc --noconfirm"
